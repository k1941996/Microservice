version: '3.8'

services:
  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network

  # MongoDB instances for each service
  auth-db:
    image: mongo:6.0
    container_name: ecommerce-auth-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - auth_db_data:/data/db
    networks:
      - ecommerce-network

  product-db:
    image: mongo:6.0
    container_name: ecommerce-product-db
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - product_db_data:/data/db
    networks:
      - ecommerce-network

  cart-db:
    image: mongo:6.0
    container_name: ecommerce-cart-db
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - cart_db_data:/data/db
    networks:
      - ecommerce-network

  order-db:
    image: mongo:6.0
    container_name: ecommerce-order-db
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - order_db_data:/data/db
    networks:
      - ecommerce-network

  # Microservices
  auth-service:
    build:
      context: ./authUsingJWTService
      dockerfile: Dockerfile
    container_name: ecommerce-auth-service
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: mongodb://admin:admin123@auth-db:27017/auth?authSource=admin
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      JWT_SECRET_KEY: your-secret-key
      SERVICE_NAME: auth-service
    depends_on:
      - auth-db
      - rabbitmq
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "10180:10180"
    environment:
      NODE_ENV: development
      PORT: 10180
      DATABASE_URL: mongodb://admin:admin123@product-db:27017/product?authSource=admin
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      SERVICE_NAME: product-service
    depends_on:
      - product-db
      - rabbitmq
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: ./CartService
      dockerfile: Dockerfile
    container_name: ecommerce-cart-service
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mongodb://admin:admin123@cart-db:27017/cart?authSource=admin
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      SERVICE_NAME: cart-service
    depends_on:
      - cart-db
      - rabbitmq
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./Order
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: mongodb://admin:admin123@order-db:27017/order?authSource=admin
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      SERVICE_NAME: order-service
    depends_on:
      - order-db
      - rabbitmq
    networks:
      - ecommerce-network

  # API Gateway (optional - can use nginx or Kong)
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
    networks:
      - ecommerce-network

volumes:
  rabbitmq_data:
  auth_db_data:
  product_db_data:
  cart_db_data:
  order_db_data:

networks:
  ecommerce-network:
    driver: bridge 